<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marks Prediction</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .prediction-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .title {
            font-weight: 700;
            color: #333;
        }

        .subtitle {
            color: #777;
        }

        .form-control {
            border-radius: 12px;
            padding: 14px;
            border: 2px solid #eee;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.2);
        }

        .predict-btn {
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transition: 0.3s;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
            color: #155724;
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        .result-number {
            font-size: 42px;
            font-weight: 700;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="prediction-card">

    <div class="text-center mb-4">
        <h1 class="title">📚 Marks Prediction</h1>
        <p class="subtitle">
            Predict your marks based on your study hours
        </p>
    </div>

    <form method="POST" action="/predict">

        <div class="mb-4">
            <label for="hours" class="form-label fw-bold">
                Study Hours
            </label>

            <input
                type="number"
                class="form-control"
                id="hours"
                name="hours"
                placeholder="Enter number of hours"
                step="0.1"
                min="0"
                required
            >
        </div>

        <button type="submit" class="btn predict-btn w-100">
            🚀 Predict My Marks
        </button>

    </form>

    {% if your_marks is not none %}
    <div class="result-box">

        <h4 class="mb-2">Your Predicted Marks</h4>

        <div class="result-number">
            {{ your_marks }}
        </div>

        <p class="mb-0">
            Keep studying and keep improving! 🎯
        </p>

    </div>
    {% endif %}

</div>

</body>
</html>
